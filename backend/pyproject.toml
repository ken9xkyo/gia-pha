[project]
name = "giapha-backend"
version = "1.0.0"
description = "Hệ thống quản lý cây gia phả Việt Nam - API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.40,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.15",
    "pydantic>=2.10",
    "pydantic-settings>=2.8",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "pyjwt>=2.10",
    "cryptography>=44",
    "redis>=5.2",
    "nh3>=0.2.20",
    "pillow>=11",
    "openpyxl>=3.1.5",
    "segno>=1.6",
    "python-multipart>=0.0.20",
    "orjson>=3.10",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "httpx>=0.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: cần PostgreSQL"]
