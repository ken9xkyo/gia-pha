# Môi trường phát triển: backend tự nạp lại code, frontend chạy Vite dev server (hot reload).
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up db redis migrate backend vite
# Mở http://localhost:5173
services:
  backend:
    build:
      context: ./backend
      target: dev
    image: giapha/backend:dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      COOKIE_SECURE: "false"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    ports:
      - "127.0.0.1:8000:8000"

  vite:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx vite --host 0.0.0.0"]
    environment:
      VITE_BACKEND: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
